<!DOCTYPE html>
<html>
<head>
    <title>Iniciar Sesión</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


    


<body class="bg-light">
   
<a href="{{ url_for('inicio') }}" class="btn btn-light position-absolute top-0 start-0 m-3">
    <i class="bi bi-arrow-left"></i> Salir
</a>
<div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card shadow p-4" style="width: 350px; border-radius: 15px; color: #333;">

        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="usuario" class="form-control" placeholder="Ingresa tu usuario">
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="Ingresa tu contraseña">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Entrar
            </button>

        </form>

        <p class="text-center mt-3">
            ¿No tienes cuenta?
            <a href="{{ url_for('registro') }}">Regístrate</a>
        </p>

    </div>

</div>

</body>
</html>
